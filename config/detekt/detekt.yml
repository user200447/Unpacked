# Built on top of detekt's default rule set (buildUponDefaultConfig = true).
# Only deviations from the defaults are listed here.

build:
  maxIssues: 0

style:
  MaxLineLength:
    maxLineLength: 120
    excludeCommentStatements: true
  MagicNumber:
    # Compose sizes such as 16.dp are declared once as named properties (ui/theme/Spacing.kt), not inline.
    ignorePropertyDeclaration: true
  UnusedPrivateMember:
    # Compose previews are private by convention and called only by the IDE.
    ignoreAnnotated: ['Preview']

complexity:
  LongParameterList:
    # A constructor whose every parameter has a default is a set of named options, not a long signature
    # (the synthetic Export generator in core:fixtures).
    ignoreDefaultParameters: true

naming:
  FunctionNaming:
    # Composables are PascalCase by convention.
    ignoreAnnotated: ['Composable']
